name: we_mama
description: "WeMama App"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.2+34

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dotted_border: ^2.1.0

  # ----------------------------
  # Firebase Core Services
  # ----------------------------
  # Required to initialize Firebase in the Flutter app
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4

  # ----------------------------
  # Social Authentication
  # ----------------------------
  # Google Sign-In (Google account authentication)
  google_sign_in: ^6.2.1

  # Apple Sign-In (Apple ID authentication for iOS/macOS)
  sign_in_with_apple: ^6.1.0

  # -----------------------------
  # 🔊 Real-time Communication (Chat & Calling)
  # -----------------------------
  agora_rtc_engine: ^6.5.3 # Audio & Video Calling (Agora RTC)
  agora_rtm: ^2.2.5 # Real-time Messaging (chat, presence, events)

  # -----------------------------
  # 🌍 Location & Maps Services
  # -----------------------------
  geolocator: ^14.0.2 # Device GPS location
  geocoding: ^4.0.0 # Convert coordinates <-> address

  # -----------------------------
  # 🔐 Permissions & Device Access
  # -----------------------------
  permission_handler: ^12.0.1 # Runtime permissions (camera, mic, location, etc.)
  image_picker: ^1.2.1 # Pick images from gallery or camera
  device_info_plus: ^10.0.0 # Device metadata information

  # -----------------------------
  # 🌐 Networking & Connectivity
  # -----------------------------
  dio: ^5.9.1 # HTTP client for APIs
  connectivity_plus: ^7.0.0 # Internet connectivity status

  # -----------------------------
  # 🗄 Local Storage
  # -----------------------------
  shared_preferences: ^2.5.4 # Simple key-value storage
  get_storage: ^2.1.1 # Lightweight storage for GetX

  # -----------------------------
  # 🏗 State Management & Architecture
  # -----------------------------
  get: ^4.7.3 # GetX (state management, routing, DI)

  # -----------------------------
  # 🎨 UI / UX & Styling
  # -----------------------------
  flutter_svg: ^2.2.3 # SVG rendering
  google_fonts: ^7.1.0 # Google Fonts support
  flutter_screenutil: ^5.9.3 # Responsive UI scaling
  gap: ^3.0.1 # Spacing widget (SizedBox alternative)
  page_transition: ^2.2.1 # Custom page transitions
  shimmer_animation: ^2.2.2+1 # Loading shimmer effect

  lottie: ^3.3.2 # Lottie animations
  fluttertoast: ^9.0.0 # Toast messages
  flutter_html: ^3.0.0 # Render HTML content
  pinput: ^6.0.1 # OTP / PIN input fields

  #
  video_player: ^2.9.2
  chewie: ^1.8.5 # gives you fullscreen + scrubber + speed controls for free

  # -----------------------------
  # 📊 Charts & Data Visualization
  # -----------------------------
  # -----------------------------
  # 🔽 Dropdowns & Selection Widgets
  # -----------------------------
  dropdown_button2: ^2.3.9
  flexible_dropdown: ^1.0.8

  # -----------------------------
  # 🌐 Web & External Links
  # -----------------------------
  url_launcher: ^6.3.2 # Open external URLs
  webview_flutter: ^4.13.1 # Embedded webview

  # -----------------------------
  # ⏳ Utilities
  # -----------------------------
  intl: ^0.20.2 # Date & number formatting
  easy_countdown_timer: ^0.0.5 # Countdown timer

  # -----------------------------
  # 🛠 Code Generation & Dev Tools
  # -----------------------------
  flutter_gen: ^5.12.0 # Asset & font code generation

  # -----------------------------
  # 📁 File Handling & Storage
  # -----------------------------
  file_picker: ^10.3.10 # Pick files from device
  flutter_image_compress: ^2.4.0 # Image compression
  path_provider: ^2.1.2 # Device file system paths
  open_file: ^3.3.2 # Open files with native apps
  file_saver: ^0.4.0 # Save files locally
  gal: ^2.3.2 # Gallery access & media handling

  # -----------------------------
  # 📤 Sharing & Communication
  # -----------------------------
  share_plus: ^12.0.1 # Share content to other apps

  # -----------------------------
  # 🔄 Realtime & Networking Extras
  # -----------------------------
  socket_io_client: ^3.1.4 # Socket.IO client for realtime apps
  app_links: ^7.0.0 # Deep links & app linking

  purchases_flutter: ^10.4.1

  # ----------------------------
  # Personal verification
  # ----------------------------
  persona_flutter: ^4.0.1

  # -----------------------------
  # ⚡ Device Power & Background Control
  # -----------------------------
  wakelock_plus: ^1.5.2 # Prevent screen sleep
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  flutter_new_badger: ^1.1.1
  flutter_widget_from_html: ^0.17.2
  timezone: ^0.11.1
  flutter_timezone: ^4.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  device_preview: ^1.2.0 # Device preview for UI testing

# flutter_native_splash:
#   color: "#ffffff"
#   image: assets/images/we_mama_logo_png.png

#   android: true
#   ios: true

flutter_native_splash:
  background_image: assets/images/launch_image.png

  android: true
  ios: true

  android_12:
    background_image: assets/images/launch_image.png

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/we_mama_hands_logo_ios.png"
  # Optional
  remove_alpha_ios: true
  min_sdk_android: 21

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_relative_imports: true
    avoid_unused_imports: true

flutter_gen:
  output: lib/gen/
  line_length: 80

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
